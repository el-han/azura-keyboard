[project]
name = "dactyl-lynx-keyboard"
version = "0.1.0"
description = "The Dactyl Lynx is a parameterized, split-hand, concave, columnar, ergonomic keyboard."
authors = [{ name = "David H. Bronke", email = "whitelynx@gmail.com" }]
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "build123d>=0.13.0,<0.14",
]

[dependency-groups]
dev = [
    "flake8>=7.1.1",
    "pyright>=1.1.390",
    "ocp-vscode>=4.2.0",
]
docs = [
    "pdoc>=15.0.0",
]

[tool.uv]
package = false
default-groups = ["dev"]
